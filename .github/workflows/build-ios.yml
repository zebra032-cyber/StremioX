# Builds an unsigned StremioX .ipa for iPhone/iPad on GitHub's free macOS machines.
# Put this file in your fork at: .github/workflows/build-ios.yml
# Then: Actions tab -> "Build StremioX iOS" -> Run workflow.
# When it finishes, download the "StremioX-iOS" artifact and sign/install it with Sideloadly.

name: Build StremioX iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Adds Chromecast casting (Google Cast SDK). Upload chromecast.patch to the repo root;
      # if it's missing, the app builds without casting.
      - name: Apply Chromecast patch
        run: |
          if [ -f chromecast.patch ]; then
            git apply --whitespace=nowarn chromecast.patch
            echo "Chromecast patch applied"
          else
            echo "::warning::chromecast.patch not found, building without Chromecast support"
          fi

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # server.js is Stremio's own streaming server. The build script expects it to be
      # pulled out of Stremio's free macOS app, so download the official app and extract it.
      - name: Get server.js from Stremio's official macOS app
        run: |
          set -euo pipefail
          curl -fL "https://dl.strem.io/stremio-shell-macos/v5.1.26/Stremio_arm64.dmg" -o Stremio.dmg
          MOUNT=$(hdiutil attach -nobrowse -readonly Stremio.dmg | tail -1 | cut -f3-)
          echo "Mounted at: $MOUNT"
          SERVER=$(find "$MOUNT" -name server.js -path "*Contents*" | head -1)
          if [ -z "$SERVER" ]; then
            echo "::error::server.js not found inside the Stremio macOS app. Contents:"
            find "$MOUNT" -maxdepth 5 | head -100
            exit 1
          fi
          echo "Found server.js at: $SERVER"
          mkdir -p reference/macos/Stremio.app/Contents/MacOS
          cp "$SERVER" reference/macos/Stremio.app/Contents/MacOS/server.js
          hdiutil detach "$MOUNT" || true

      - name: Fetch embedded server dependencies
        run: |
          chmod +x scripts/*.sh
          ./scripts/fetch-server-deps.sh

      - name: Build the Stremio web interface
        run: ./scripts/build-web.sh

      # project.yml references a fonts folder that isn't in the repo; an empty one lets the
      # project generate (only affects subtitle fonts for non-Latin scripts).
      - name: Generate Xcode project
        run: |
          mkdir -p app/Resources/fonts
          cd app && xcodegen generate

      - name: Build app (unsigned)
        run: |
          cd app
          xcodebuild \
            -project StremioX.xcodeproj \
            -scheme StremioX \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package .ipa
        run: |
          set -euo pipefail
          APP=$(find app/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "Built: $APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry StremioX-iOS.ipa Payload -x '*.DS_Store')
          shasum -a 256 out/StremioX-iOS.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: StremioX-iOS
          path: out/StremioX-iOS.ipa
